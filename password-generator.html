<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tools.css">
    <link rel="stylesheet" href="css/password-generator.css">
</head>
<body>
<main class="container">
    <nav class="tool-nav" aria-label="Ferramentas">
        <a href="index.html" class="tool-link">📄 PDF Merger</a>
        <a href="date-calculator.html" class="tool-link">📅 Datas</a>
        <a href="pdf-to-image.html" class="tool-link">🖼️ PDF → Imagem</a>
        <a href="image-to-pdf.html" class="tool-link">📑 Imagem → PDF</a>
        <a href="financial-calculator.html" class="tool-link">💰 Financeira</a>
        <a href="password-generator.html" class="tool-link active">🔐 Senhas</a>
    </nav>

    <header>
        <h1>Gerador de Senhas</h1>
        <p class="tool-description">Gere senhas aleatórias localmente, com controle de tamanho e caracteres.</p>
    </header>

    <section class="tool-card password-card">
        <div class="password-output">
            <input id="password" type="text" readonly aria-label="Senha gerada">
            <button id="copyButton" type="button">Copiar</button>
        </div>
        <div class="password-strength"><span>Força</span><strong id="strength">—</strong><div class="strength-bar"><i id="strengthBar"></i></div></div>
        <div class="password-options">
            <div class="form-field"><label for="length">Tamanho: <span id="lengthValue">16</span></label><input id="length" type="range" min="6" max="64" value="16"></div>
            <label class="check"><input id="uppercase" type="checkbox" checked> Letras maiúsculas</label>
            <label class="check"><input id="lowercase" type="checkbox" checked> Letras minúsculas</label>
            <label class="check"><input id="numbers" type="checkbox" checked> Números</label>
            <label class="check"><input id="symbols" type="checkbox" checked> Símbolos</label>
        </div>
        <button id="generateButton" class="tool-button">Gerar nova senha</button>
        <p id="message" class="copy-message" aria-live="polite"></p>
    </section>
</main>
<script src="js/password-generator.js"></script>
</body>
</html>
