<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Financeira</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tools.css">
    <link rel="stylesheet" href="css/financial-calculator.css">
</head>
<body>
<main class="container">
    <nav class="tool-nav" aria-label="Ferramentas">
        <a href="index.html" class="tool-link">📄 PDF Merger</a>
        <a href="date-calculator.html" class="tool-link">📅 Datas</a>
        <a href="pdf-to-image.html" class="tool-link">🖼️ PDF → Imagem</a>
        <a href="image-to-pdf.html" class="tool-link">📑 Imagem → PDF</a>
        <a href="financial-calculator.html" class="tool-link active">💰 Financeira</a>
        <a href="password-generator.html" class="tool-link">🔐 Senhas</a>
    </nav>

    <header>
        <h1>Calculadora Financeira</h1>
        <p class="tool-description">Simule juros compostos, aportes mensais e a evolução do seu dinheiro ao longo do tempo.</p>
    </header>

    <section class="tool-card">
        <div class="form-grid">
            <div class="form-field"><label for="initial">Valor inicial (R$)</label><input id="initial" type="number" min="0" step="0.01" value="1000"></div>
            <div class="form-field"><label for="monthly">Aporte mensal (R$)</label><input id="monthly" type="number" min="0" step="0.01" value="500"></div>
            <div class="form-field"><label for="rate">Taxa de juros (% ao ano)</label><input id="rate" type="number" step="0.01" value="10"></div>
            <div class="form-field"><label for="months">Período (meses)</label><input id="months" type="number" min="1" step="1" value="60"></div>
        </div>
        <div class="form-field rate-type-field"><label for="rateType">Tipo da taxa</label><select id="rateType"><option value="annual">Anual</option><option value="monthly">Mensal</option></select></div>
        <button id="calculateButton" class="tool-button">Calcular simulação</button>

        <div id="result" class="financial-result hidden">
            <div class="financial-highlight"><span>Patrimônio final</span><strong id="finalValue">R$ 0,00</strong></div>
            <div class="financial-grid">
                <div><span>Total investido</span><strong id="invested">R$ 0,00</strong></div>
                <div><span>Juros ganhos</span><strong id="interest">R$ 0,00</strong></div>
                <div><span>Rendimento sobre investido</span><strong id="returnRate">0%</strong></div>
            </div>
            <div class="chart-wrap"><canvas id="growthChart" height="240"></canvas></div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="js/financial-calculator.js"></script>
</body>
</html>
