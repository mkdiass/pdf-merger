<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Merger</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <main class="container">

        <header>
            <h1>Mesclar PDFs</h1>
            <p>Junte vários arquivos PDF em um único documento.</p>
        </header>

        <section class="upload-area" id="uploadArea">

            <div class="upload-icon">
                +
            </div>

            <h2>Adicionar PDFs</h2>

            <p>
                Arraste seus arquivos aqui
                <br>
                ou selecione no computador
            </p>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,application/pdf"
                multiple
            >

            <label for="fileInput" class="button">
                Selecionar PDFs
            </label>

        </section>

        <section class="files-section">

            <div class="files-header">
                <h2>Arquivos selecionados</h2>

                <button id="clearButton">
                    Limpar
                </button>
            </div>

            <div id="fileList" class="file-list">
                <p class="empty">
                    Nenhum PDF selecionado.
                </p>
            </div>

        </section>

        <button id="mergeButton" class="merge-button" disabled>
            Mesclar PDFs
        </button>
        <h3>Feito por David</h3>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
